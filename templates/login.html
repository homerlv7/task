<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - Disparador TASK AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0f33a2;
      --dark-bg: #1A1E23;
      --white: #ffffff;
      --light-gray: #f8f9fa;
      --medium-gray: #e9ecef;
      --accent-blue: #1e4dd8;
      --hover-blue: #0d2a85;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }

    .login-card {
      background-color: var(--white);
      color: var(--dark-bg);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .login-header {
      background-color: var(--primary-blue);
      color: var(--white);
      padding: 30px;
      text-align: center;
    }

    .login-header img {
      max-width: 150px;
      height: auto;
      filter: brightness(0) invert(1);
      margin-bottom: 20px;
    }

    .login-body {
      padding: 40px 30px;
    }

    .login-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .login-tab {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--medium-gray);
      background-color: var(--white);
      color: var(--dark-bg);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      font-weight: 600;
    }

    .login-tab:hover {
      border-color: var(--primary-blue);
    }

    .login-tab.active {
      background-color: var(--primary-blue);
      color: var(--white);
      border-color: var(--primary-blue);
    }

    .form-label {
      color: var(--dark-bg);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background-color: var(--light-gray);
      border: 2px solid var(--medium-gray);
      color: var(--dark-bg);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background-color: var(--white);
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 0.2rem rgba(15, 51, 162, 0.15);
    }

    .btn-primary {
      background-color: var(--primary-blue);
      border: none;
      color: var(--white);
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: var(--hover-blue);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(15, 51, 162, 0.3);
    }

    .help-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .help-link a {
      color: var(--primary-blue);
      text-decoration: none;
    }

    .help-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background-color: rgba(220, 53, 69, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message {
      background-color: rgba(40, 167, 69, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .loading-spinner::after {
      content: "";
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid var(--medium-gray);
      border-radius: 50%;
      border-top-color: var(--primary-blue);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="https://hjsjnkwuyrcpkggdkypp.supabase.co/storage/v1/object/public/task//task3-.png" alt="Logo TASK AI">
        <h3>Acessar Disparador</h3>
        <p style="opacity: 0.9; font-size: 14px;">Entre com suas credenciais</p>
      </div>

      <div class="login-body">
        <!-- Tabs de login -->
        <div class="login-tabs">
          <div class="login-tab active" data-type="codigo">
            Código + PIN
          </div>
          <div class="login-tab" data-type="email">
            Email
          </div>
          <div class="login-tab" data-type="telefone">
            Telefone
          </div>
        </div>

        <!-- Mensagens -->
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Formulários -->
        <form id="loginForm">
          <!-- Form Código + PIN -->
          <div id="codigoForm" class="login-form">
            <div class="mb-3">
              <label for="codigo" class="form-label">Código de Acesso</label>
              <input type="text" class="form-control" id="codigo" placeholder="TASK-XXXXX" required>
            </div>
            <div class="mb-4">
              <label for="pin" class="form-label">PIN</label>
              <input type="text" class="form-control" id="pin" placeholder="0000" maxlength="4" required>
            </div>
          </div>

          <!-- Form Email -->
          <div id="emailForm" class="login-form" style="display: none;">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" placeholder="••••••" required>
            </div>
          </div>

          <!-- Form Telefone -->
          <div id="telefoneForm" class="login-form" style="display: none;">
            <div class="mb-3">
              <label for="telefone" class="form-label">WhatsApp</label>
              <input type="tel" class="form-control" id="telefone" placeholder="(11) 99999-9999" required>
            </div>
            <div class="mb-4">
              <label for="codigoVerificacao" class="form-label">Código de Verificação</label>
              <input type="text" class="form-control" id="codigoVerificacao" placeholder="000000" maxlength="6" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            Entrar no Disparador
          </button>
        </form>

        <div class="loading-spinner" id="loadingSpinner"></div>

        <div class="help-link">
          <a href="#" onclick="showHelp()">Esqueceu suas credenciais?</a><br>
          <a href="conexao_lead.html">Criar nova conexão</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const YOUR_BACKEND_API_URL = "http://127.0.0.1:5000/api/lead";
    let selectedLoginType = 'codigo';

    // Tabs de login
    document.querySelectorAll('.login-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        selectedLoginType = this.dataset.type;
        
        // Esconder todos os forms
        document.querySelectorAll('.login-form').forEach(form => {
          form.style.display = 'none';
        });
        
        // Mostrar form selecionado
        document.getElementById(`${selectedLoginType}Form`).style.display = 'block';
        
        // Limpar mensagens
        hideMessages();
      });
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      showLoading(true);

      let credentials = {};

      // Coletar credenciais baseado no tipo
      switch(selectedLoginType) {
        case 'codigo':
          credentials = {
            tipo: 'codigo',
            codigo: document.getElementById('codigo').value.trim(),
            pin: document.getElementById('pin').value.trim()
          };
          break;
          
        case 'email':
          credentials = {
            tipo: 'email',
            email: document.getElementById('email').value.trim(),
            senha: document.getElementById('senha').value
          };
          break;
          
        case 'telefone':
          credentials = {
            tipo: 'telefone',
            telefone: document.getElementById('telefone').value.trim().replace(/\D/g, ''),
            codigo: document.getElementById('codigoVerificacao').value.trim()
          };
          break;
      }

      try {
        // Verificar credenciais no backend
        const response = await fetch(`${YOUR_BACKEND_API_URL}/verificar-credenciais`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(credentials)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Credenciais inválidas');
        }

        // Sucesso - salvar dados e redirecionar
        showSuccess('Login realizado com sucesso! Redirecionando...');
        
        // Salvar configuração para o disparador
        localStorage.setItem('evolutionConfig', JSON.stringify({
          backendUrl: YOUR_BACKEND_API_URL.replace('/verificar-credenciais', ''),
          instance: result.instanceName,
          owner: result.owner,
          apikey: result.apikey,
          connectedAt: new Date().toISOString()
        }));

        // Redirecionar após 1 segundo
        setTimeout(() => {
          window.location.href = 'disparador_lead.html';
        }, 1000);

      } catch (error) {
        console.error('Erro no login:', error);
        showError(error.message);
      } finally {
        showLoading(false);
      }
    });

    // Funções auxiliares
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('errorMessage').style.display = 'none';
      document.getElementById('successMessage').style.display = 'none';
    }

    function showLoading(show) {
      document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
      document.querySelector('button[type="submit"]').disabled = show;
    }

    function showHelp() {
      alert('Entre em contato com o suporte TASK AI:\n\n📧 Email: suporte@task.ai\n📱 WhatsApp: (11) 99999-9999');
    }

    // Verificar se tem credenciais salvas temporariamente
    window.onload = () => {
      const tempCredentials = localStorage.getItem('taskAICredentials');
      if (tempCredentials) {
        const creds = JSON.parse(tempCredentials);
        // Preencher form se acabou de criar
        if (creds.tipo === 'codigo' && (Date.now() - new Date(creds.timestamp).getTime()) < 60000) {
          showSuccess('Conexão criada! Use suas credenciais para entrar.');
        }
      }
    };

    // Máscaras de input
    document.getElementById('pin').addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '');
    });

    document.getElementById('codigoVerificacao').addEventListener('input', function(e) {
      this.value = this.value.replace(/\D/g, '');
    });

    document.getElementById('telefone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 0) {
        if (value.length <= 2) {
          value = `(${value}`;
        } else if (value.length <= 7) {
          value = `(${value.slice(0,2)}) ${value.slice(2)}`;
        } else {
          value = `(${value.slice(0,2)}) ${value.slice(2,7)}-${value.slice(7,11)}`;
        }
      }
      e.target.value = value;
    });
  </script>
</body>
</html>
