<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin - TASK AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Tema escuro moderno */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-color: #e6edf3;
      --text-muted: #8b949e;
      --accent: #00ffae;
      --btn-bg: #00b86b;
      --btn-hover: #00ffae;
      --success-color: #238636;
      --danger-color: #da3633;
      --warning-color: #d29922;
      --info-color: #58a6ff;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .navbar {
      background-color: var(--bg-secondary) !important;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 0;
    }

    .navbar-brand {
      color: var(--accent) !important;
      font-weight: bold;
      font-size: 1.5rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .table {
      color: var(--text-color);
    }

    .table thead th {
      background-color: var(--bg-secondary);
      color: var(--accent);
      border-color: var(--border-color);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.875rem;
      padding: 1rem;
    }

    .table tbody td {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      padding: 1rem;
      vertical-align: middle;
    }

    .table tbody tr:hover td {
      background-color: rgba(0, 255, 174, 0.05);
    }

    .badge {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-weight: 500;
    }

    .badge-success {
      background-color: var(--success-color);
      color: white;
    }

    .badge-danger {
      background-color: var(--danger-color);
      color: white;
    }

    .badge-warning {
      background-color: var(--warning-color);
      color: #000;
    }

    .badge-info {
      background-color: var(--info-color);
      color: white;
    }

    .btn {
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: var(--btn-bg);
      border-color: var(--btn-bg);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--btn-hover);
      filter: brightness(1.1);
    }

    .btn-success {
      background-color: var(--success-color);
      border-color: var(--success-color);
    }

    .btn-danger {
      background-color: var(--danger-color);
      border-color: var(--danger-color);
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
    }

    .stats-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stats-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .stats-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stats-label {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
    }

    .search-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .search-box:focus {
      background-color: var(--bg-primary);
      border-color: var(--accent);
      color: var(--text-color);
      box-shadow: 0 0 0 0.2rem rgba(0, 255, 174, 0.25);
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .modal-header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .modal-footer {
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .form-control, .form-select {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .form-control:focus, .form-select:focus {
      background-color: var(--bg-primary);
      border-color: var(--accent);
      color: var(--text-color);
      box-shadow: 0 0 0 0.2rem rgba(0, 255, 174, 0.25);
    }

    .form-label {
      color: var(--text-color);
      font-weight: 500;
    }

    .text-muted {
      color: var(--text-muted) !important;
    }

    .alert {
      border-radius: 8px;
      border: 1px solid;
    }

    .alert-success {
      background-color: rgba(35, 134, 54, 0.1);
      border-color: var(--success-color);
      color: var(--success-color);
    }

    .alert-danger {
      background-color: rgba(218, 54, 51, 0.1);
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    .pagination .page-link {
      background-color: var(--bg-secondary);
      border-color: var(--border-color);
      color: var(--text-color);
    }

    .pagination .page-link:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .pagination .page-item.active .page-link {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .btn-close-white {
      filter: invert(1);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="bi bi-speedometer2"></i> TASK AI Admin
      </a>
      <div class="ms-auto">
        <button class="btn btn-danger btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container-fluid mt-4">
    <!-- Stats Cards -->
    <div class="row mb-4">
      <div class="col-md-3 mb-3">
        <div class="stats-card">
          <div class="stats-number" id="totalLeads">0</div>
          <div class="stats-label">Total de Leads</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stats-card">
          <div class="stats-number" id="activeLeads">0</div>
          <div class="stats-label">Leads Ativos</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stats-card">
          <div class="stats-number" id="connectedInstances">0</div>
          <div class="stats-label">Instâncias Conectadas</div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="stats-card">
          <div class="stats-number" id="totalPlans">0</div>
          <div class="stats-label">Planos Cadastrados</div>
        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div id="alertContainer"></div>

    <!-- Main Card -->
    <div class="card">
      <div class="card-header bg-transparent border-bottom">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h5 class="mb-0">
              <i class="bi bi-people"></i> Gerenciamento de Leads
            </h5>
          </div>
          <div class="col-md-6">
            <div class="d-flex gap-2 justify-content-md-end">
              <input type="text" class="form-control search-box" id="searchInput" placeholder="Buscar por nome ou email...">
              <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addLeadModal">
                <i class="bi bi-plus-circle"></i> Novo Lead
              </button>
              <button class="btn btn-success" id="refreshBtn">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>WhatsApp</th>
                <th>Plano</th>
                <th>Instância</th>
                <th>Status</th>
                <th>Criado em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody">
              <!-- Leads serão carregados aqui -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4">
      <nav>
        <ul class="pagination" id="pagination">
          <!-- Paginação será gerada aqui -->
        </ul>
      </nav>
    </div>
  </div>

  <!-- Modal Adicionar Lead -->
  <div class="modal fade" id="addLeadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-person-plus"></i> Adicionar Novo Lead
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addLeadForm">
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="newLeadName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="newLeadEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">WhatsApp</label>
              <input type="text" class="form-control" id="newLeadPhone" placeholder="(11) 98765-4321">
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" id="newLeadPassword" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Plano</label>
              <select class="form-select" id="newLeadPlan">
                <option value="">Selecione um plano</option>
                <!-- Planos serão carregados aqui -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="newLeadStatus">
                <option value="1">Ativo</option>
                <option value="0">Inativo</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="saveNewLeadBtn">
            <i class="bi bi-check-circle"></i> Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Editar Lead -->
  <div class="modal fade" id="editLeadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-pencil"></i> Editar Lead
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editLeadForm">
            <input type="hidden" id="editLeadId">
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="editLeadName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="editLeadEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">WhatsApp</label>
              <input type="text" class="form-control" id="editLeadPhone">
            </div>
            <div class="mb-3">
              <label class="form-label">Nova Senha (deixe em branco para manter)</label>
              <input type="password" class="form-control" id="editLeadPassword">
            </div>
            <div class="mb-3">
              <label class="form-label">Plano</label>
              <select class="form-select" id="editLeadPlan">
                <option value="">Selecione um plano</option>
                <!-- Planos serão carregados aqui -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="editLeadStatus">
                <option value="1">Ativo</option>
                <option value="0">Inativo</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="updateLeadBtn">
            <i class="bi bi-check-circle"></i> Atualizar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Configurações
    const BACKEND_BASE_URL = "http://127.0.0.1:5000/api/admin";
    const ADMIN_TOKEN = "SEU_TOKEN_ADMIN_SUPER_SECRETO_AQUI_12345";
    
    // Estado da aplicação
    let allLeads = [];
    let currentPage = 1;
    const leadsPerPage = 10;

    // Função para mostrar alertas
    function showAlert(message, type = 'success') {
      const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
      document.getElementById('alertContainer').innerHTML = alertHtml;
      setTimeout(() => {
        const alert = document.querySelector('.alert');
        if (alert) alert.remove();
      }, 5000);
    }

    // Função para fazer requisições autenticadas
    async function apiRequest(endpoint, options = {}) {
      const defaultOptions = {
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Token': ADMIN_TOKEN
        }
      };
      
      const finalOptions = {
        ...defaultOptions,
        ...options,
        headers: {
          ...defaultOptions.headers,
          ...options.headers
        }
      };

      try {
        const response = await fetch(`${BACKEND_BASE_URL}${endpoint}`, finalOptions);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Erro na requisição');
        }
        
        return data;
      } catch (error) {
        console.error('Erro na API:', error);
        throw error;
      }
    }

    // Carregar estatísticas
    async function loadStats() {
      try {
        const stats = await apiRequest('/stats');
        document.getElementById('totalLeads').textContent = stats.total_leads || 0;
        document.getElementById('activeLeads').textContent = stats.active_leads || 0;
        document.getElementById('connectedInstances').textContent = stats.connected_instances || 0;
        document.getElementById('totalPlans').textContent = stats.total_plans || 0;
      } catch (error) {
        console.error('Erro ao carregar estatísticas:', error);
      }
    }

    // Carregar planos
    async function loadPlans() {
      try {
        const plans = await apiRequest('/plans');
        const planOptions = plans.map(plan => 
          `<option value="${plan.id}">${plan.name} - ${plan.description || 'Sem descrição'}</option>`
        ).join('');
        
        document.getElementById('newLeadPlan').innerHTML = '<option value="">Selecione um plano</option>' + planOptions;
        document.getElementById('editLeadPlan').innerHTML = '<option value="">Selecione um plano</option>' + planOptions;
      } catch (error) {
        console.error('Erro ao carregar planos:', error);
      }
    }

    // Carregar leads
    async function loadLeads() {
      try {
        const leads = await apiRequest('/leads');
        allLeads = leads;
        displayLeads();
        loadStats();
      } catch (error) {
        showAlert('Erro ao carregar leads: ' + error.message, 'danger');
      }
    }

    // Exibir leads com paginação e busca
    function displayLeads() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      // Filtrar leads
      const filteredLeads = allLeads.filter(lead => 
        lead.name.toLowerCase().includes(searchTerm) || 
        lead.email.toLowerCase().includes(searchTerm)
      );

      // Calcular paginação
      const totalPages = Math.ceil(filteredLeads.length / leadsPerPage);
      const startIndex = (currentPage - 1) * leadsPerPage;
      const endIndex = startIndex + leadsPerPage;
      const leadsToDisplay = filteredLeads.slice(startIndex, endIndex);

      // Renderizar tabela
      const tbody = document.getElementById('leadsTableBody');
      tbody.innerHTML = leadsToDisplay.map(lead => `
        <tr>
          <td>${lead.id}</td>
          <td><strong>${lead.name}</strong></td>
          <td>${lead.email}</td>
          <td>${lead.phone || '-'}</td>
          <td>
            <span class="badge badge-info">
              ${lead.plan_name || 'Sem plano'}
            </span>
          </td>
          <td>
            ${lead.instance_name ? 
              `<span class="badge ${lead.instance_status === 'open' ? 'badge-success' : 'badge-warning'}">
                ${lead.instance_name}
              </span>` : 
              '<span class="text-muted">-</span>'
            }
          </td>
          <td>
            <span class="badge ${lead.is_active ? 'badge-success' : 'badge-danger'}">
              ${lead.is_active ? 'Ativo' : 'Inativo'}
            </span>
          </td>
          <td>
            <small class="text-muted">
              ${new Date(lead.created_at).toLocaleDateString('pt-BR')}
            </small>
          </td>
          <td>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-primary" onclick="editLead(${lead.id})" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn ${lead.is_active ? 'btn-warning' : 'btn-success'}" 
                      onclick="toggleLeadStatus(${lead.id}, ${lead.is_active})"
                      title="${lead.is_active ? 'Desativar' : 'Ativar'}">
                <i class="bi bi-${lead.is_active ? 'pause' : 'play'}"></i>
              </button>
              <button class="btn btn-danger" onclick="deleteLead(${lead.id})" title="Excluir">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      // Renderizar paginação
      renderPagination(totalPages);
    }

    // Renderizar paginação
    function renderPagination(totalPages) {
      const pagination = document.getElementById('pagination');
      
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = '';
      
      // Botão anterior
      html += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
      `;

      // Páginas
      for (let i = 1; i <= totalPages; i++) {
        html += `
          <li class="page-item ${currentPage === i ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
          </li>
        `;
      }

      // Botão próximo
      html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      `;

      pagination.innerHTML = html;
    }

    // Mudar página
    function changePage(page) {
      currentPage = page;
      displayLeads();
    }

    // Adicionar novo lead
    document.getElementById('saveNewLeadBtn').addEventListener('click', async () => {
      const leadData = {
        name: document.getElementById('newLeadName').value,
        email: document.getElementById('newLeadEmail').value,
        phone: document.getElementById('newLeadPhone').value || null,
        password: document.getElementById('newLeadPassword').value,
        plan_id: document.getElementById('newLeadPlan').value || null,
        is_active: document.getElementById('newLeadStatus').value === '1'
      };

      try {
        await apiRequest('/leads', {
          method: 'POST',
          body: JSON.stringify(leadData)
        });
        
        showAlert('Lead criado com sucesso!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('addLeadModal')).hide();
        document.getElementById('addLeadForm').reset();
        loadLeads();
      } catch (error) {
        showAlert('Erro ao criar lead: ' + error.message, 'danger');
      }
    });

    // Editar lead
    async function editLead(leadId) {
      const lead = allLeads.find(l => l.id === leadId);
      if (!lead) return;

      document.getElementById('editLeadId').value = lead.id;
      document.getElementById('editLeadName').value = lead.name;
      document.getElementById('editLeadEmail').value = lead.email;
      document.getElementById('editLeadPhone').value = lead.phone || '';
      document.getElementById('editLeadPassword').value = '';
      document.getElementById('editLeadPlan').value = lead.plan_id || '';
      document.getElementById('editLeadStatus').value = lead.is_active ? '1' : '0';

      const modal = new bootstrap.Modal(document.getElementById('editLeadModal'));
      modal.show();
    }

    // Atualizar lead
    document.getElementById('updateLeadBtn').addEventListener('click', async () => {
      const leadId = document.getElementById('editLeadId').value;
      const leadData = {
        name: document.getElementById('editLeadName').value,
        email: document.getElementById('editLeadEmail').value,
        phone: document.getElementById('editLeadPhone').value || null,
        plan_id: document.getElementById('editLeadPlan').value || null,
        is_active: document.getElementById('editLeadStatus').value === '1'
      };

      const password = document.getElementById('editLeadPassword').value;
      if (password) {
        leadData.password = password;
      }

      try {
        await apiRequest(`/leads/${leadId}`, {
          method: 'PUT',
          body: JSON.stringify(leadData)
        });
        
        showAlert('Lead atualizado com sucesso!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('editLeadModal')).hide();
        loadLeads();
      } catch (error) {
        showAlert('Erro ao atualizar lead: ' + error.message, 'danger');
      }
    });

    // Toggle status do lead
    async function toggleLeadStatus(leadId, currentStatus) {
      const newStatus = !currentStatus;
      
      try {
        await apiRequest(`/leads/${leadId}/toggle-status`, {
          method: 'POST',
          body: JSON.stringify({ is_active: newStatus })
        });
        
        showAlert(`Lead ${newStatus ? 'ativado' : 'desativado'} com sucesso!`, 'success');
        loadLeads();
      } catch (error) {
        showAlert('Erro ao alterar status: ' + error.message, 'danger');
      }
    }

    // Deletar lead
    async function deleteLead(leadId) {
      if (!confirm('Tem certeza que deseja excluir este lead?')) return;

      try {
        await apiRequest(`/leads/${leadId}`, {
          method: 'DELETE'
        });
        
        showAlert('Lead excluído com sucesso!', 'success');
        loadLeads();
      } catch (error) {
        showAlert('Erro ao excluir lead: ' + error.message, 'danger');
      }
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', displayLeads);
    document.getElementById('refreshBtn').addEventListener('click', loadLeads);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Deseja realmente sair?')) {
        window.location.href = 'lead_login.html';
      }
    });

    // Inicializar
    loadPlans();
    loadLeads();
    
    // Atualizar dados a cada 30 segundos
    setInterval(loadLeads, 30000);
  </script>
</body>
</html>
